services:
  postgres:
    image: postgres:16-alpine
    container_name: ro-ed-postgres
    environment:
      POSTGRES_DB: ro_ed
      POSTGRES_USER: ro_ed
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ro_ed_dev_pass}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ro_ed"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g

  redis:
    image: redis:7-alpine
    container_name: ro-ed-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 768m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ro-ed-lang-app:latest
    pull_policy: never
    container_name: ro-ed-api
    expose:
      - "9000"
    # Publish to the host so an external reverse proxy (AWS ALB target,
    # nginx, OpenWebUI) can reach the app without the bundled nginx.
    # Default binds to LOOPBACK ONLY — not exposed on the EC2 public IP.
    #   • host-process proxy on the same box → leave default (127.0.0.1)
    #   • containerised proxy / ALB to the instance → set APP_BIND=0.0.0.0 in .env
    #     AND restrict port 9000 in the security group to the proxy only.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-9000}:9000"
    env_file: ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg://ro_ed:${PG_PASSWORD:-ro_ed_dev_pass}@postgres:5432/ro_ed
      REDIS_URL: redis://redis:6379/0
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9000",
              "--proxy-headers", "--forwarded-allow-ips", "*",
              "--workers", "2",
              "--limit-concurrency", "50",
              "--timeout-keep-alive", "300"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ro-ed-lang-app:latest
    pull_policy: never
    env_file: ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg://ro_ed:${PG_PASSWORD:-ro_ed_dev_pass}@postgres:5432/ro_ed
      REDIS_URL: redis://redis:6379/0
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped
    mem_limit: 8g
    cpus: 4
    command: ["python", "/app/worker.py"]
    healthcheck:
      # Robust: same REDIS_URL fallback the worker code uses + a connect timeout,
      # so the probe can't false-fail when REDIS_URL is unset or the box is busy.
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ.get('REDIS_URL','redis://redis:6379/0'), socket_connect_timeout=5).ping()\" || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    deploy:
      # Job throughput scales with replicas. Each worker processes 1 job at a
      # time (~100-135s); for N replicas the 10th simultaneous upload waits
      # ~(10/N)*120s. Raise WORKER_REPLICAS to your host RAM budget
      # (each worker mem_limit=8g → N=3 ≈ 24g, N=5 ≈ 40g).
      replicas: ${WORKER_REPLICAS:-3}

  nginx:
    image: nginx:1.27-alpine
    container_name: ro-ed-nginx
    ports:
      - "9080:80"
      - "9443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  pg-backup:
    image: postgres:16-alpine
    container_name: ro-ed-pg-backup
    environment:
      PGPASSWORD: ${PG_PASSWORD:-ro_ed_dev_pass}
      RETENTION_DAYS: "14"
    volumes:
      - pg-backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/pg_backup_loop.sh"]

volumes:
  pg-data:
  redis-data:
  app-data:
  pg-backups:
